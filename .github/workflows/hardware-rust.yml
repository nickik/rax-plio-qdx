name: Hardware Rust

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-rust.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-rust.yml'
  workflow_dispatch:

concurrency:
  group: hardware-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Test PLIO hardware workspace
        run: cargo test --manifest-path hardware/Cargo.toml --all-targets
