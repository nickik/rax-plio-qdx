name: Hardware QDX-B

on:
  push:
    branches: [qdx-b-minimal]
  pull_request:
    paths:
      - 'hardware/qdx-b/**'
      - 'hardware/qdx-b-card/**'
      - 'hardware/qdx-a/**'
      - 'hardware/qdx-a-card/**'
      - 'hardware/qli16/**'
      - 'hardware/qli/**'
      - 'hardware/qic/**'
      - 'hardware/pti/**'
      - 'hardware/plio-tx/**'
      - 'hardware/testbench/**'
      - 'hardware/scripts/test-qdx-b.sh'
      - '.github/workflows/hardware-qdx-b.yml'
  workflow_dispatch:

concurrency:
  group: hardware-qdx-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qdx-b:
    runs-on: ubuntu-24.04
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Tool check
        run: |
          cargo --version
          bsc -help >/dev/null
          echo "BSC $BSC_VERSION installed"

      - name: Run QDX-B validation
        run: bash hardware/scripts/test-qdx-b.sh
