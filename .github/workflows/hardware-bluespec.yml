name: Hardware Bluespec

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/**'
      - '.github/actions/setup-bsc/**'
      - '.github/workflows/hardware-bluespec.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/actions/setup-bsc/**'
      - '.github/workflows/hardware-bluespec.yml'
  workflow_dispatch:

concurrency:
  group: hardware-bluespec-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BSC_VERSION: '2026.01'
  BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
  BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'

jobs:
  bluespec-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RTL and iCE40 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys nextpnr-ice40
      - uses: ./.github/actions/setup-bsc
        with:
          version: ${{ env.BSC_VERSION }}
          url: ${{ env.BSC_URL }}
          sha256: ${{ env.BSC_SHA256 }}
      - name: Tool checks
        run: |
          cargo --version
          bsc -help >/dev/null
          iverilog -V | head -1
          yosys -V
          nextpnr-ice40 --version
      - name: QLI/QIC Bluespec core, differential, Verilog, and synthesis gates
        run: make -C hardware test-bluespec-core

  mainboard-fpga:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - uses: ./.github/actions/setup-bsc
        with:
          version: ${{ env.BSC_VERSION }}
          url: ${{ env.BSC_URL }}
          sha256: ${{ env.BSC_SHA256 }}
      - name: Full mainboard FPGA regression
        run: make -C hardware test-mainboard-fpga
      - name: Upload mainboard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainboard-bluespec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hardware/mainboard-fpga/build/**/compile.log
            hardware/mainboard-fpga/build/**/run.log
          if-no-files-found: warn
          retention-days: 7

  memory-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - uses: ./.github/actions/setup-bsc
        with:
          version: ${{ env.BSC_VERSION }}
          url: ${{ env.BSC_URL }}
          sha256: ${{ env.BSC_SHA256 }}
      - name: Memory-controller regressions
        run: make -C hardware test-memory-controller-all
      - name: Upload memory-controller diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-controller-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hardware/build/memory-controller/**
            hardware/build/memory-controller-backend/**
            hardware/build/memory-controller-bram/**
          if-no-files-found: warn
          retention-days: 7
