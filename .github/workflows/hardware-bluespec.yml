name: Hardware Bluespec

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-bluespec.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-bluespec.yml'
  workflow_dispatch:

concurrency:
  group: hardware-bluespec-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qli-naked-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RTL and iCE40 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys nextpnr-ice40
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Tool checks
        run: |
          cargo --version
          bsc -help >/dev/null
          iverilog -V | head -1
          yosys -V
          nextpnr-ice40 --version

      - name: P0 minimal - CPU response lifecycle
        run: make -C hardware/mainboard-fpga -f Makefile.p0 test-cpu-response

      - name: P0 minimal - PLIO response lifecycle
        if: always()
        run: make -C hardware/mainboard-fpga -f Makefile.p0 test-plio-response

      # Each boundary has an independent executable and an explicit PASS
      # marker check. Bluesim does not reliably propagate $finish(1) through
      # every shell invocation, so the text result is part of the gate.
      - name: Mainboard diagnostic - CPU grant retention
        run: |
          make -C hardware/mainboard-fpga test-cpu-grant
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-grant/run.log
          grep -Fq 'PASS|cpu-grant|' hardware/mainboard-fpga/build/diag-cpu-grant/run.log

      - name: Mainboard diagnostic - CPU write/backend
        if: always()
        run: |
          make -C hardware/mainboard-fpga test-cpu-write
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-write/run.log
          grep -Fq 'PASS|cpu-write|' hardware/mainboard-fpga/build/diag-cpu-write/run.log

      - name: Mainboard diagnostic - CPU read/backend
        if: always()
        run: |
          make -C hardware/mainboard-fpga test-cpu-read
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-read/run.log
          grep -Fq 'PASS|cpu-read|' hardware/mainboard-fpga/build/diag-cpu-read/run.log

      - name: Mainboard diagnostic - reset/stale response/recovery
        if: always()
        run: |
          make -C hardware/mainboard-fpga test-reset-recovery
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-reset-recovery/run.log
          grep -Fq 'PASS|reset-recovery|' hardware/mainboard-fpga/build/diag-reset-recovery/run.log

      - name: Mainboard diagnostic - PLIO DMA
        if: always()
        run: |
          make -C hardware/mainboard-fpga test-plio-dma
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-plio-dma/run.log
          grep -Fq 'PASS|plio-dma|' hardware/mainboard-fpga/build/diag-plio-dma/run.log

      - name: QDX-B isolation - raw card reset cycle
        if: always()
        run: make -C hardware/mainboard-fpga -f Makefile.diagnostics test-qdx-card-cycle

      - name: QDX-B isolation - mainboard slot reset cycle
        if: always()
        run: make -C hardware/mainboard-fpga -f Makefile.diagnostics test-qdx-slot-cycle

      - name: Mainboard diagnostic - physical QDX-B
        if: always()
        run: |
          make -C hardware/mainboard-fpga test-qdx-b
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/qdxb/run.log
          grep -Fq 'PASS mainboard FPGA <-> physical mkQDXBCard integration' hardware/mainboard-fpga/build/qdxb/run.log

      - name: Upload mainboard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainboard-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hardware/mainboard-fpga/build/**/compile.log
            hardware/mainboard-fpga/build/**/run.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run full mainboard FPGA regression
        run: make -C hardware test-mainboard-fpga

      - name: Run memory-controller regression with full diagnostics
        env:
          MEMORY_CONTROLLER_DEBUG_DIR: ${{ runner.temp }}/memory-controller-debug
        run: |
          bash hardware/scripts/test-memory-controller.sh
          bash hardware/scripts/test-memory-controller-backend.sh
          bash hardware/scripts/test-memory-controller-bram.sh
      - name: Upload memory-controller diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-controller-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-controller-debug
          if-no-files-found: warn
          retention-days: 7
      - name: Compile, simulate, cross-check, and synthesize Phase-0 hardware support
        run: make -C hardware test-bluespec
