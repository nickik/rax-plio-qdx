name: QIC Phase3 Literal Debug

on:
  push:
    branches:
      - qic-phase3-literal-notification-regression
    paths:
      - 'hardware/qic/bluespec/TbQICPhase3.bsv'
      - '.github/workflows/qic-phase3-literal-debug.yml'

concurrency:
  group: qic-phase3-literal-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-literal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Compile and run only QIC Phase3 fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/hardware"
          BUILD="$RUNNER_TEMP/qic-phase3"
          SEARCH="+:$ROOT/qli/bluespec:$ROOT/naked-card/bluespec:$ROOT/qli16/bluespec:$ROOT/pti/bluespec:$ROOT/trace/bluespec:$ROOT/qic/bluespec"
          mkdir -p "$BUILD"
          bsc -u -sim -p "$SEARCH" -bdir "$BUILD" -simdir "$BUILD" -info-dir "$BUILD" -g mkTbQICPhase3 "$ROOT/qic/bluespec/TbQICPhase3.bsv"
          bsc -sim -p "$SEARCH" -bdir "$BUILD" -simdir "$BUILD" -e mkTbQICPhase3 -o "$BUILD/tb-qic-phase3"
          "$BUILD/tb-qic-phase3" | tee "$BUILD/qic-phase3.log"
          echo '--- notification address cycles ---'
          grep -E '^TRACE\|v1\|c=0000000[45]\|' "$BUILD/qic-phase3.log"
