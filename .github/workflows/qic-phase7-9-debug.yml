name: QIC Phase7-9 Debug

on:
  push:
    branches:
      - qic-phase7-9-completion
    paths:
      - 'hardware/qic/**'
      - 'hardware/scripts/test-qic-phase7.sh'
      - 'hardware/scripts/test-qic-phase8.sh'
      - 'hardware/scripts/test-qic-phase9.sh'
      - '.github/workflows/qic-phase7-9-debug.yml'

concurrency:
  group: qic-phase7-9-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bluespec and synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys iverilog
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Phase 7 safety
        run: bash hardware/scripts/test-qic-phase7.sh
      - name: Phase 8 differential
        if: ${{ hashFiles('hardware/scripts/test-qic-phase8.sh') != '' }}
        run: bash hardware/scripts/test-qic-phase8.sh
      - name: Phase 9 Verilog smoke
        if: ${{ hashFiles('hardware/scripts/test-qic-phase9.sh') != '' }}
        run: bash hardware/scripts/test-qic-phase9.sh
