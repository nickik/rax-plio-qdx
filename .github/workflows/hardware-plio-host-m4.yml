name: Hardware PLIO Host M4

on:
  push:
    branches:
      - plio-host-adapter-m4
    paths:
      - 'hardware/plio-rax-host/**'
      - 'hardware/plio-logical/**'
      - 'hardware/testbench/**'
      - 'hardware/Cargo.toml'
      - 'hardware/scripts/test-plio-host-m4.sh'
      - '.github/workflows/hardware-plio-host-m4.yml'
  pull_request:
    paths:
      - 'hardware/plio-rax-host/**'
      - 'hardware/plio-logical/**'
      - 'hardware/testbench/**'
      - 'hardware/Cargo.toml'
      - 'hardware/scripts/test-plio-host-m4.sh'
      - '.github/workflows/hardware-plio-host-m4.yml'
  workflow_dispatch:

concurrency:
  group: hardware-plio-host-m4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plio-host-m4:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Tool check
        run: |
          rustc --version
          cargo --version
          bsc -help >/dev/null
          echo "BSC $BSC_VERSION installed"
      - name: Run PLIO host M4 validation
        run: bash hardware/scripts/test-plio-host-m4.sh
