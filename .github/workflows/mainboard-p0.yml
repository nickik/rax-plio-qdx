name: Mainboard P0 Debug

on:
  pull_request:
    paths:
      - 'hardware/mainboard-fpga/**'
      - '.github/workflows/mainboard-p0.yml'
  workflow_dispatch:

concurrency:
  group: mainboard-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BSC_VERSION: '2026.01'
  BSC_URL: https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz
  BSC_SHA256: 9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3

jobs:
  cpu-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: CPU response lifecycle
        run: make -C hardware/mainboard-fpga -f Makefile.p0 test-cpu-response
      - name: Upload CPU trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-cpu-response-${{ github.run_id }}
          path: hardware/mainboard-fpga/build/p0/cpu-response/*.log
          if-no-files-found: warn

  plio-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: PLIO response lifecycle
        run: make -C hardware/mainboard-fpga -f Makefile.p0 test-plio-response
      - name: Upload PLIO trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-plio-response-${{ github.run_id }}
          path: hardware/mainboard-fpga/build/p0/plio-response/*.log
          if-no-files-found: warn

  cpu-established:
    needs: [cpu-response, plio-response]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: CPU grant retention
        run: |
          make -C hardware/mainboard-fpga test-cpu-grant
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-grant/run.log
          grep -Fq 'PASS|cpu-grant|' hardware/mainboard-fpga/build/diag-cpu-grant/run.log
      - name: CPU write/backend
        run: |
          make -C hardware/mainboard-fpga test-cpu-write
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-write/run.log
          grep -Fq 'PASS|cpu-write|' hardware/mainboard-fpga/build/diag-cpu-write/run.log
      - name: CPU read/backend
        run: |
          make -C hardware/mainboard-fpga test-cpu-read
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-cpu-read/run.log
          grep -Fq 'PASS|cpu-read|' hardware/mainboard-fpga/build/diag-cpu-read/run.log
      - name: Reset stale-response recovery
        run: |
          make -C hardware/mainboard-fpga test-reset-recovery
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-reset-recovery/run.log
          grep -Fq 'PASS|reset-recovery|' hardware/mainboard-fpga/build/diag-reset-recovery/run.log
      - name: Upload CPU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-cpu-established-${{ github.run_id }}
          path: hardware/mainboard-fpga/build/diag-*/run.log
          if-no-files-found: warn

  plio-dma:
    needs: [cpu-response, plio-response]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: One-beat PLIO DMA
        run: |
          make -C hardware/mainboard-fpga test-plio-dma
          ! grep -q '^FAIL|' hardware/mainboard-fpga/build/diag-plio-dma/run.log
          grep -Fq 'PASS|plio-dma|' hardware/mainboard-fpga/build/diag-plio-dma/run.log
      - name: Upload PLIO DMA trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-plio-dma-${{ github.run_id }}
          path: hardware/mainboard-fpga/build/diag-plio-dma/*.log
          if-no-files-found: warn
