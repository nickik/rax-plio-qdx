name: Hardware PLIO-TX

on:
  workflow_dispatch:

concurrency:
  group: hardware-plio-tx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-bluesim-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BSC_VERSION: '2026.01'
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Tool checks
        run: |
          cargo --version
          bsc -help >/dev/null
          echo "BSC $BSC_VERSION installed"
      - name: Rust / Bluesim PLIO-TX equivalence
        run: bash hardware/scripts/test-plio-tx.sh
