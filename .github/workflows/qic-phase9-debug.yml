name: QIC Phase9 Debug

on:
  push:
    branches:
      - qic-phase7-9-completion
    paths:
      - 'hardware/scripts/test-qic-phase9.sh'
      - '.github/workflows/qic-phase9-debug.yml'

concurrency:
  group: qic-phase9-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase9-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BSC_URL: 'https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz'
      BSC_SHA256: '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3'
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          test -x "$prefix/bin/bsc"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Run Phase9 only with synthesis diagnostics
        run: bash hardware/scripts/test-qic-phase9.sh
