name: Phase0 PLIO prose patch

on:
  push:
    paths:
      - '.github/workflows/phase0-plio-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clarify address ACK/ERR handshake prose
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('specs/PLIO.md')
          s = p.read_text()
          worker_old = """6. asserts `AS*`.\n\n### 10.2 Data phase\n"""
          worker_new = """6. asserts `AS*`.\n\nThe selected worker MUST terminate the address phase with `ACK*` or `ERR*`. It MAY insert address-phase wait states by asserting neither response. The controller MUST hold the address, parity, `SPACE`, `RD`, `BE`, `BLEN`, `SEL`, and `AS*` stable until the address phase is accepted, rejected, or reaches the 256-clock address/data-beat timeout. The data phase MUST NOT begin before address `ACK*`.\n\n### 10.2 Data phase\n"""
          dma_old = """If validation or address parity fails, the controller returns `ERR*` and no data beat is committed.\n\nAfter validation:\n"""
          dma_new = """If validation or address parity fails, the controller returns `ERR*` and no data beat is committed. While validation is outstanding, the controller MAY insert address-phase wait states by asserting neither `ACK*` nor `ERR*`; the manager MUST hold the complete address/control image stable. Successful validation is completed with address-phase `ACK*`, and the manager MUST NOT begin the first data beat before observing that `ACK*`. The same 256-clock per-address/data-beat timeout applies to this address phase.\n\nAfter validation:\n"""
          changed = False
          if worker_old in s:
              s = s.replace(worker_old, worker_new, 1)
              changed = True
          elif worker_new not in s:
              raise SystemExit('worker address-phase anchor not found')
          if dma_old in s:
              s = s.replace(dma_old, dma_new, 1)
              changed = True
          elif dma_new not in s:
              raise SystemExit('DMA address-phase anchor not found')
          p.write_text(s)
          print('changed=', changed)
          PY
          git diff --check
          git diff -- specs/PLIO.md

      - name: Commit clarification if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- specs/PLIO.md; then
            echo 'PLIO prose already clarified'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/PLIO.md
          git commit -m 'Clarify PLIO address phase ACK handshake'
          git push
