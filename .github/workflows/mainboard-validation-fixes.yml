name: Mainboard Validation Fixes

on:
  pull_request:
    paths:
      - 'hardware/mainboard-fpga/**'
      - '.github/workflows/mainboard-validation-fixes.yml'
  workflow_dispatch:

concurrency:
  group: mainboard-validation-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BSC_VERSION: '2026.01'
  BSC_URL: https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz
  BSC_SHA256: 9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3

jobs:
  registered-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Registered backend boundary
        run: make -C hardware/mainboard-fpga test-core
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainboard-registered-backend-${{ github.run_id }}
          path: |
            hardware/mainboard-fpga/build/core/compile.log
            hardware/mainboard-fpga/build/core/run.log
          if-no-files-found: warn

  verilog-sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - name: Install pinned Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bsc.tar.gz"
          prefix="$RUNNER_TEMP/bsc"
          curl -L --fail --retry 5 --retry-delay 2 "$BSC_URL" -o "$archive"
          echo "$BSC_SHA256  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Generated Verilog structural check
        run: make -C hardware/mainboard-fpga verilog-sanity
